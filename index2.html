<!DOCTYPE html>
<html>
<head>
<title>...</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}


@keyframes fondo {
    0% { background: red; }
    25% { background: blue; }
    50% { background: green; }
    75% { background: purple; }
    100% { background: red; }
}

body {
    animation: fondo 1s infinite;
}


#dvd {
    position: absolute;
    color: white;
    font-size: 30px;
    font-family: monospace;
    font-weight: bold;
}
</style>

</head>

<body>

<div id="dvd">DVD</div>

<script>
let x = 100;
let y = 100;
let dx = 3;
let dy = 3;

const dvd = document.getElementById("dvd");

function mover() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    x += dx;
    y += dy;

    // rebote en paredes
    if (x + dvd.offsetWidth > width || x < 0) {
        dx *= -1;
    }
    if (y + dvd.offsetHeight > height || y < 0) {
        dy *= -1;
    }

    dvd.style.left = x + "px";
    dvd.style.top = y + "px";

    requestAnimationFrame(mover);
}

mover();
</script>

</body>
</html>
